services:
  app:
    build:
      context: .
      args:
        APP_VERSION: 1.0.0-SNAPSHOT
    image: zulu25-service:local
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      JAVA_OPTS: "-XX:MaxRAMPercentage=75.0 -XX:+ExitOnOutOfMemoryError"
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      # No curl in the -jre-headless image, so probe from the host side of the
      # bridge with the shell's /dev/tcp - enough to see that the port is open.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /readyz HTTP/1.0\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q 200"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
